; SCI-PH fingerprint reader: ESP32 + R307.
; Versions are pinned (no floating ranges): platform-espressif32 8.0.0 bundles Arduino-ESP32 3.3.12.

[platformio]
default_envs = esp32dev

[env]
build_flags =
    -I src
    -D ARDUINOJSON_ENABLE_STD_STRING=1
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3

[esp32_base]
platform = platformio/espressif32 @ 8.0.0
platform_packages =
    platformio/framework-arduinoespressif32 @ 4.30312.261024
    platformio/framework-arduinoespressif32-esp32-libs @ 3.3.12
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*>
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit Fingerprint Sensor Library @ 2.1.4

; Production: HTTPS with CA validation only. Plain HTTP and slot diagnostics are rejected at compile time.
[env:esp32dev]
extends = esp32_base
build_flags =
    ${env.build_flags}
    -D SCIPH_PRODUCTION=1
    -D SCIPH_ALLOW_DEV_HTTP=0
    -D SCIPH_DEBUG_SLOTS=0

; Development: also accepts http:// to a Device API with RequireHttps=false on an isolated network.
[env:esp32dev-devhttp]
extends = esp32_base
build_flags =
    ${env.build_flags}
    -D SCIPH_ALLOW_DEV_HTTP=1

; Host tests (Unity): the portable logic with simulated sensor, HTTP, NVS and clock. Hardware adapters are excluded.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<*> -<main.cpp> -<**/*_esp32.cpp>
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -D SCIPH_ALLOW_DEV_HTTP=1
