# Entorno de desarrollo local de SCI-PH.
# Por ahora solo incluye PostgreSQL; las APIs se agregarán más adelante.
#
# Uso:
#   1. Copiar .env.example a .env y definir valores propios.
#   2. docker compose up -d

name: sci-ph

services:
  postgres:
    image: postgres:17-alpine
    container_name: sci-ph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      # Solo expuesto en localhost.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: sci-ph-postgres-data
