server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Redirige cualquier ruta no encontrada a index.html (vital para React Router)
        try_files $uri $uri/ /index.html;
    }

    # Manejo opcional de errores de servidor
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}