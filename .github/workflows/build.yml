name: Build

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SCI-PH.sln

      - name: Build
        run: dotnet build SCI-PH.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test SCI-PH.sln --no-build --configuration Release --verbosity normal
