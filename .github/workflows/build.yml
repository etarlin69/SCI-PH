name: Build

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: "true"
      # PostgreSQL 17 tests (Testcontainers) must run in CI: without Docker they fail instead of being skipped.
      SCIPH_REQUIRE_DOCKER: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore SCI-PH.sln

      - name: Build
        run: dotnet build SCI-PH.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test SCI-PH.sln --no-build --configuration Release --verbosity normal

      # Fails when an entity or configuration changed without its migration.
      # The connection string only lets the startup host build; no database is contacted.
      - name: Migration consistency
        env:
          ConnectionStrings__SciPhDatabase: "Host=localhost;Database=sciph_ci_model_check;Username=ci"
        run: |
          dotnet ef migrations has-pending-model-changes \
            --context IdentityDbContext \
            --project src/Infrastructure/SCI-PH.Persistence \
            --startup-project src/Presentation/SCI-PH.Web.BFF \
            --configuration Release \
            --no-build

          dotnet ef migrations has-pending-model-changes \
            --context ClinicalDbContext \
            --project src/Infrastructure/SCI-PH.Persistence \
            --startup-project src/Presentation/SCI-PH.Web.BFF \
            --configuration Release \
            --no-build

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/web-admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/web-admin/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  containers:
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: sciph_ci
      POSTGRES_USER: sciph_ci
      POSTGRES_PASSWORD: ci_only_password
      POSTGRES_PORT: "5432"

      JWT_SIGNING_KEY: ci_only_signing_key_0123456789_abcdefghijklmnopqrstuvwxyz

      WEB_PORT: "5173"
      WEB_BFF_PORT: "5074"
      MOBILE_BFF_PORT: "5191"
      DEVICE_API_PORT: "5139"

      AZURITE_BLOB_PORT: "10000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build
